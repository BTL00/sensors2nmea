[build-system]
# >=77 for PEP 639 (SPDX license expression + license-files)
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sensors2nmea"
version = "1.0.0"
description = "Windows Sensors API (GNSS, compass, inclinometer) to NMEA 0183 over TCP, with GPX track playback"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
# NOTICE ships with every distribution: Apache-2.0 section 4(d) requires
# redistributors to reproduce it, so it must not be left out of the package.
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Piotr Bomba", email = "bombapiotr@gmail.com" }]
keywords = [
    "nmea", "nmea0183", "gnss", "gps", "marine", "navigation",
    "opencpn", "winrt", "windows", "gpx", "chartplotter",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: System :: Hardware",
]

# Rdzen nie ma zaleznosci: --simulate i --gpx dzialaja na czystym Pythonie,
# takze na Linuksie i macOS. Czujniki Windows sa opcjonalnym dodatkiem, zeby
# "pip install sensors2nmea" nie wymagal WinRT tam, gdzie go nie ma.
dependencies = []

[project.optional-dependencies]
sensors = [
    "winrt-runtime>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Devices.Sensors>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Devices.Geolocation>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2.0; sys_platform == 'win32'",
]

[project.scripts]
sensors2nmea = "sensors2nmea:cli"

[project.urls]
Homepage = "https://github.com/BTL00/sensors2nmea"
Repository = "https://github.com/BTL00/sensors2nmea"
Issues = "https://github.com/BTL00/sensors2nmea/issues"

[tool.setuptools]
py-modules = ["sensors2nmea"]
